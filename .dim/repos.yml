schemaVersion: 1
repositories:
  main:
    ref: main
    defaultBranch: main
    protect: [main, development]
    branches:
      main: {review: true}
      development: {review: false}
    upstream:
      url: https://github.com/ai-slops/rss.git
      branch: main
    publish: {main: main}
policy:
  code-review:
    requiredReviewerIds: []
    pathReviewerRules:
      - pathPrefix: .dim/
        reviewerIds: [mjy]
  merge-policy: {}
