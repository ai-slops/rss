name: live-production
services:
  server:
    image: live-production:local
    build:
      context: ../var/container
      dockerfile: ../../deploy/Dockerfile
    restart: unless-stopped
    init: true
    user: "${LIVE_UID:-1000}:${LIVE_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    environment:
      LIVE_PRODUCTION_VIDEO_WIDTH: "1920"
      LIVE_PRODUCTION_VIDEO_HEIGHT: "1080"
      LIVE_PRODUCTION_VIDEO_FPS: "60"
      LIVE_PRODUCTION_PREVIEW_NETWORK_CONFIG: /run/preview-network.json
    volumes:
      - ../var/production/state:/state
      - ../var/production/preview-network.json:/run/preview-network.json:ro
    ports:
      - "${LIVE_LAN_IP:-10.10.142.3}:9000-9015:9000-9015/udp"
      - "${LIVE_LAN_IP:-10.10.142.3}:50000-50100:50000-50100/udp"
    stop_grace_period: 35s
    logging:
      options:
        max-size: 10m
        max-file: "3"
  https:
    image: "${LIVE_CADDY_IMAGE:-caddy:2}"
    user: "${LIVE_UID:-1000}:${LIVE_GID:-1000}"
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      LIVE_HTTPS_NAMES: "${LIVE_HTTPS_NAMES:?Set public IP or domain in deploy environment}"
      LIVE_TLS_DEFAULT_NAME: "${LIVE_TLS_DEFAULT_NAME:?Set the public IP or domain for clients without SNI}"
    ports:
      - "${LIVE_LAN_IP:-10.10.142.3}:8443:8443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../var/production/caddy-data:/data
      - ../var/production/caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    logging:
      options:
        max-size: 10m
        max-file: "3"
