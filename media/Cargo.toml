[package]
name = "live-production-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "GStreamer media owner for Live Production"
publish = false

[lib]
name = "live_production_media"
path = "src/lib.rs"

[[bin]]
name = "live-production-media"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.6.7", features = ["derive"] }
gstreamer = "=0.24.5"
gstreamer-app = "=0.24.5"
gio = "=0.21.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
num-traits = "=0.2.19"
uuid = { version = "=1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
