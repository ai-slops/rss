[package]
name = "live-production-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version = "1.91"

[dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.6.7", features = ["derive"] }
nix = { version = "=0.30.1", features = ["process", "signal"] }
signal-hook = "=0.3.18"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
